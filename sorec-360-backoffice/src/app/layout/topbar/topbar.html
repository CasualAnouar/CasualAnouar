<header class="topbar">
  <label class="field search">
    <app-icon name="search" [size]="17" />
    <input type="search" [placeholder]="'topbar.searchPlaceholder' | translate" />
  </label>

  <div class="top-actions">
    <button type="button" class="icon-btn" [attr.aria-label]="'topbar.help' | translate">
      <app-icon name="help" [size]="18" />
    </button>
    <button
      type="button"
      class="icon-btn has-dot"
      [attr.aria-label]="'topbar.notifications' | translate"
    >
      <app-icon name="bell" [size]="18" />
    </button>

    <button type="button" class="user-chip">
      <app-avatar [label]="currentUser().initials" tone="blue" [size]="30" />
      <span class="user-chip-text">
        <span class="user-chip-name">{{ currentUser().name }}</span>
        <span class="user-chip-role">{{ currentUser().roleLabel | translate }}</span>
      </span>
      <app-icon name="chevron-down" [size]="16" />
    </button>
  </div>
</header>
