<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="Anouar DADAS - Senior Fullstack Engineer">
  <title>Anouar DADAS - Senior Fullstack Engineer</title>

  <defs>
    <clipPath id="card">
      <rect x="1" y="1" width="898" height="238" rx="18" ry="18"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f8"/>
    </linearGradient>

    <radialGradient id="blobBlue">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0969da" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobViolet">
      <stop offset="0%" stop-color="#8250df" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#8250df" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobTeal">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1f2328" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="56" y1="0" x2="456" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="0.5" stop-color="#8250df"/>
      <stop offset="1" stop-color="#0969da"/>
      <animate attributeName="x1" values="56;456" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="456;856" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="borderGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="240" spreadMethod="repeat">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.12"/>
      <stop offset="0.35" stop-color="#0969da" stop-opacity="0.6"/>
      <stop offset="0.65" stop-color="#8250df" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0.12"/>
      <animate attributeName="x1" values="-600;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;600" dur="9s" repeatCount="indefinite"/>
    </linearGradient>

    <clipPath id="clipLine1"><rect x="56" y="142" width="0" height="28">
      <animate attributeName="width" dur="18s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0;0.0833;0.25;0.3055;1" values="0;356.4;356.4;0;0"/>
    </rect></clipPath>
    <clipPath id="clipLine2"><rect x="56" y="142" width="0" height="28">
      <animate attributeName="width" dur="18s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0;0.3333;0.4166;0.5833;0.6388;1" values="0;0;378;378;0;0"/>
    </rect></clipPath>
    <clipPath id="clipLine3"><rect x="56" y="142" width="0" height="28">
      <animate attributeName="width" dur="18s" repeatCount="indefinite" calcMode="linear"
               keyTimes="0;0.6667;0.75;0.9166;0.9722;1" values="0;0;378;378;0;0"/>
    </rect></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="900" height="240" fill="url(#bg)"/>
    <rect width="900" height="240" fill="url(#grid)"/>

    <g filter="url(#soft)">
      <circle r="150" fill="url(#blobBlue)" cx="120" cy="60">
        <animate attributeName="cx" values="120;240;120" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;20;60" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle r="170" fill="url(#blobViolet)" cx="720" cy="210">
        <animate attributeName="cx" values="720;600;720" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="210;250;210" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle r="130" fill="url(#blobTeal)" cx="450" cy="250">
        <animate attributeName="cx" values="450;520;450" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="250;200;250" dur="24s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- floating particles -->
    <g fill="#0969da">
      <circle cx="520" cy="52" r="2">
        <animate attributeName="opacity" values="0.15;0.8;0.15" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="566" cy="196" r="1.6" fill="#8250df">
        <animate attributeName="opacity" values="0.7;0.1;0.7" dur="5.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="488" cy="212" r="1.8">
        <animate attributeName="opacity" values="0.1;0.6;0.1" dur="6.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="864" cy="40" r="1.6" fill="#0f766e">
        <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- code card -->
    <g>
      <rect x="596" y="48" width="256" height="144" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#d1d9e0"/>
      <circle cx="617" cy="69" r="4.5" fill="#ff5f57"/>
      <circle cx="633" cy="69" r="4.5" fill="#febc2e"/>
      <circle cx="649" cy="69" r="4.5" fill="#28c840"/>
      <line x1="596" y1="90" x2="852" y2="90" stroke="#d1d9e0"/>
      <g>
        <rect x="616" y="106" width="122" height="7" rx="3.5" fill="#0969da">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="3.6s" begin="0s" repeatCount="indefinite"/>
        </rect>
        <rect x="616" y="124" width="94" height="7" rx="3.5" fill="#1a7f37">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="3.6s" begin="-0.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="632" y="142" width="150" height="7" rx="3.5" fill="#8250df">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="3.6s" begin="-1s" repeatCount="indefinite"/>
        </rect>
        <rect x="632" y="160" width="78" height="7" rx="3.5" fill="#bc4c00">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="3.6s" begin="-1.5s" repeatCount="indefinite"/>
        </rect>
        <rect x="616" y="178" width="112" height="7" rx="3.5" fill="#8c959f">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="3.6s" begin="-2s" repeatCount="indefinite"/>
        </rect>
        <rect x="736" y="177" width="8" height="9" rx="1.5" fill="#0969da">
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <!-- left content -->
    <text x="56" y="76" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600"
          letter-spacing="6" fill="#59636e">HELLO, I'M</text>

    <text x="56" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800"
          fill="url(#nameGrad)">Anouar DADAS</text>

    <g font-family="ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#59636e">
      <g clip-path="url(#clipLine1)">
        <text x="56" y="162" textLength="356.4" lengthAdjust="spacingAndGlyphs">Senior Fullstack Engineer @ SOREC</text>
      </g>
      <g clip-path="url(#clipLine2)">
        <text x="56" y="162" textLength="378" lengthAdjust="spacingAndGlyphs">Angular + Spring Boot + Liferay DXP</text>
      </g>
      <g clip-path="url(#clipLine3)">
        <text x="56" y="162" textLength="378" lengthAdjust="spacingAndGlyphs">Enterprise platforms, shipped clean</text>
      </g>
    </g>

    <!-- carets -->
    <g>
      <g opacity="0">
        <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
                 keyTimes="0;0.32;0.3201;1" values="1;1;0;0"/>
        <rect x="56" y="144" width="2" height="22" fill="#0969da">
          <animate attributeName="x" dur="18s" repeatCount="indefinite" calcMode="linear"
                   keyTimes="0;0.0833;0.25;0.3055;1" values="56;412.4;412.4;56;56"/>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
                 keyTimes="0;0.3333;0.3334;0.6533;0.6534;1" values="0;0;1;1;0;0"/>
        <rect x="56" y="144" width="2" height="22" fill="#8250df">
          <animate attributeName="x" dur="18s" repeatCount="indefinite" calcMode="linear"
                   keyTimes="0;0.3333;0.4166;0.5833;0.6388;1" values="56;56;434;434;56;56"/>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
      <g opacity="0">
        <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
                 keyTimes="0;0.6667;0.6668;0.9866;0.9867;1" values="0;0;1;1;0;0"/>
        <rect x="56" y="144" width="2" height="22" fill="#0f766e">
          <animate attributeName="x" dur="18s" repeatCount="indefinite" calcMode="linear"
                   keyTimes="0;0.6667;0.75;0.9166;0.9722;1" values="56;56;434;434;56;56"/>
          <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>

    <rect x="56" y="186" width="24" height="4" rx="2" fill="url(#nameGrad)">
      <animate attributeName="width" values="24;104;24" dur="6s" repeatCount="indefinite"/>
    </rect>

    <text x="56" y="216" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#6e7781">
      Berrechid, Morocco &#183; building things that hold up in production
    </text>
  </g>

  <rect x="1" y="1" width="898" height="238" rx="18" ry="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>
</svg>
